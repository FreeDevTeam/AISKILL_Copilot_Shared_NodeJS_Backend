name: Sync AI skills to project repos

# Khi có commit thay đổi skill / instruction / template / script trên main:
# checkout từng repo dự án (submodule trong projects/), copy file theo ai-sync.config.json,
# rồi commit + push lên branch chore/sync-ai-skills và tạo / cập nhật PR ở repo dự án.
#
# Yêu cầu secrets:
#   AI_SYNC_SSH_PRIVATE_KEY: SSH private key có quyền push lên tất cả repo dự án.
#   AI_SYNC_TOKEN (không bắt buộc): Personal Access Token (fine-grained) có quyền Pull requests: Read and write
#     trên tất cả repo dự án để tạo / cập nhật PR qua GitHub API. Nếu không cấu hình, workflow vẫn push branch
#     đồng bộ qua SSH nhưng bỏ qua bước tạo / cập nhật PR.
# (SSH dùng cho Git clone / push; AI_SYNC_TOKEN chỉ dùng cho GitHub API.)

on:
  push:
    branches: [main]
    paths:
      - '.copilot/**'
      - 'templates/**'
      - 'scripts/**'
      - 'ai-sync.config.json'
      - '.gitmodules'
      - '.github/workflows/sync-ai-config.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Tên target trong ai-sync.config.json (để trống = tất cả)'
        required: false
        default: ''
      dry_run:
        description: 'Chỉ in ra thay đổi, không commit / push'
        type: boolean
        required: false
        default: false

concurrency:
  group: sync-ai-config
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout shared repo
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AI_SYNC_SSH_PRIVATE_KEY }}

      - name: Add GitHub SSH host key
        run: |
          mkdir -p -m 0700 ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Sync skills / instructions / configs
        env:
          AI_SYNC_TOKEN: ${{ secrets.AI_SYNC_TOKEN }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=()
          if [ -n "$INPUT_TARGET" ]; then
            ARGS+=(--target "$INPUT_TARGET")
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          else
            ARGS+=(--push)
          fi
          node scripts/sync-ai-config.js "${ARGS[@]}"
